name: Build

on:
  workflow_dispatch:
    inputs:
      source_fw_url:
        description: 'Source Firmware URL'
        required: false
        type: string
      target_fw_url:
        description: 'Target Firmware URL'
        required: false
        type: string
  pull_request:
  push:
    branches:
      - 'sixteen'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        target: [a34x]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          submodules: 'recursive'

      - name: Free disk space (1/3)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          sudo docker builder prune -a

      - name: Free disk space (2/3)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true

      - name: Free disk space (3/3)
        uses: rokibhasansagar/slimhub_actions@main
        with:
          retain: 'compiler_cmake'

      - name: Set up build environment
        run: |
          sudo apt update
          DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            7zip attr ccache clang ffmpeg \
            libbrotli-dev libgtest-dev libprotobuf-dev libunwind-dev libpcre2-dev \
            libzstd-dev linux-modules-extra-$(uname -r) lld protobuf-compiler webp
          sudo modprobe erofs f2fs
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo -n "${{ secrets.PLATFORM_KEY_PK8 }}" | base64 --decode > security/unica_platform.pk8
          echo -n "${{ secrets.PLATFORM_KEY_PEM }}" | base64 --decode > security/unica_platform.x509.pem

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Build dependencies
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/build_dependencies.sh

      - name: Download firmware
        if: github.event_name == 'workflow_dispatch'
        env:
          SOURCE_FW_URL: ${{ inputs.source_fw_url }}
          TARGET_FW_URL: ${{ inputs.target_fw_url }}
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          export SOURCE_FW_URL TARGET_FW_URL
          ./scripts/download_fw.sh

      - name: Extract stock firmwares
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/extract_fw.sh

      - name: Build ROM
        run: |
          source ./buildenv.sh ${{ matrix.target }}
          ./scripts/make_rom.sh
          
      - name: Upload to GoFile 
        if: success()
        run: |
          ROM_ZIP=$(find out/ -name "UN1CA_*.zip" -type f | head -n 1)
          if [ -z "$ROM_ZIP" ]; then
            ROM_ZIP=$(find . -name "UN1CA_*.zip" -type f | head -n 1)
          fi
          
          if [ -f "$ROM_ZIP" ]; then
            echo "Fetching optimal GoFile server..."
            SERVER=$(curl -s https://api.gofile.io/servers | python3 -c "import sys, json; print(json.load(sys.stdin)['data']['servers'][0]['name'])")
            
            echo "Uploading $(basename "$ROM_ZIP") to $SERVER.gofile.io..."
            
            # Upload with progress bar, save response to file to prevent terminal corruption
            curl --progress-bar -F "file=@$ROM_ZIP" "https://$SERVER.gofile.io/contents/uploadFile" -o gofile_response.json 2>/dev/null || \
            curl --progress-bar -F "file=@$ROM_ZIP" "https://$SERVER.gofile.io/uploadFile" -o gofile_response.json 2>/dev/null
            
            echo ""
            echo "Parsing response..."
            
            python3 -c "
          import sys, json
          try:
              with open('gofile_response.json', 'r') as f:
                  r = json.load(f)
              if r.get('status') == 'ok':
                  d = r.get('data', {})
                  code = d.get('code', '')
                  guest_token = d.get('guestToken', '')
                  page = f'https://gofile.io/d/{code}'
                  print('Upload successful!')
                  print(f'Download page : {page}')
                  if guest_token:
                      print(f'Guest Token   : {guest_token} (Save this to manage/delete your file)')
              else:
                  print('Upload failed:', r)
                  sys.exit(1)
          except Exception as e:
              print('Failed to parse response:', e)
              sys.exit(1)
          "
            rm -f gofile_response.json
          else
            echo "No ROM zip found in output directory."
            exit 1
          fi
